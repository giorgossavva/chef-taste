<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Chef&rsquo;s Taste</title>
  <style>
    :root { --ink: #1A1A1A; --gold: #D4AF37; --muted: #666; }
    html, body { height: 100%; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); background: #fff;
           display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .logo { font-size: 22px; font-weight: 300; letter-spacing: 6px; }
    .rule { width: 36px; height: 1px; background: var(--gold); margin: 18px auto 26px; }
    h1 { font-size: 20px; font-weight: 300; margin: 0 0 10px; }
    p { color: var(--muted); font-weight: 300; line-height: 1.6; margin: 0 0 8px; }
    a { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <div class="logo">CHEF&rsquo;S TASTE</div>
    <div class="rule"></div>
    <h1>Our app is under development.</h1>
    <p>Coming soon.</p>
    <p>Questions about your data, or to have it deleted: <a href="mailto:hello@chef-taste.com">hello@chef-taste.com</a></p>
  </main>
</body>
</html>
